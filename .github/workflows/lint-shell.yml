name: Lint shell scripts with ShellCheck

on:
  workflow_call:
    inputs:
      shellcheck-version:
        description: Exact ShellCheck release version without the leading v.
        required: false
        type: string
        default: 0.10.0
      working-directory:
        description: Repository-relative directory containing shell scripts.
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate working directory
        id: target
        uses: DevOpsDerek/workflows/.github/actions/validate-repository-directory@7f6c8dbd3156bd67db0d05ee2ab501028b16792f
        with:
          path: ${{ inputs.working-directory }}
          name: working-directory
      - name: Validate exact version
        shell: bash
        env:
          SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
        run: |
          set -euo pipefail
          [[ "$SHELLCHECK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::shellcheck-version must be an exact three-part version."
            exit 1
          }
      - name: Install pinned ShellCheck
        shell: bash
        env:
          SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          curl --fail --location --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            --output "$archive"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
      - name: Check shell scripts
        working-directory: ${{ steps.target.outputs.absolute-path }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find . -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.bats' \) -print0
          )
          if ((${#files[@]} == 0)); then
            echo "::error::No .sh, .bash, or .bats files found under working-directory."
            exit 1
          fi
          shellcheck --shell=bash --severity=style "${files[@]}"
