name: Validate GitHub automation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      gh-aw-version:
        description: Exact gh-aw release tag to use for compilation.
        required: false
        type: string
        default: v0.89.21
      workflows-directory:
        description: Directory containing gh-aw Markdown sources and lock files.
        required: false
        type: string
        default: .github/workflows

permissions:
  contents: read

jobs:
  validate:
    name: Validate Actions and gh-aw sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Lint non-gh-aw GitHub Actions workflows
        shell: bash
        env:
          WORKFLOWS_DIRECTORY: ${{ inputs.workflows-directory || '.github/workflows' }}
        run: |
          set -euo pipefail
          [[ -d "$WORKFLOWS_DIRECTORY" ]] || {
            echo "::error::Workflow directory '$WORKFLOWS_DIRECTORY' does not exist."
            exit 1
          }
          mapfile -d '' workflows < <(
            find "$WORKFLOWS_DIRECTORY" -type f \( -name '*.yml' -o -name '*.yaml' \) \
              ! -name '*.lock.yml' -print0
          )
          if ((${#workflows[@]})); then
            go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
              -no-color "${workflows[@]}"
          fi
      - name: Install pinned gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@44af92291c2e544760940d3bfb8fcc37506c161e
        with:
          version: ${{ inputs.gh-aw-version || 'v0.89.21' }}
      - name: Test local gh-aw components and generated-lock compatibility
        if: github.repository == 'DevOpsDerek/workflows' && github.event_name != 'workflow_call'
        run: python3 tests/catalog_imports.py --catalog-directory "$GITHUB_WORKSPACE"
      - name: Test SHA-pinned remote imports and inlined locks
        if: >-
          github.repository == 'DevOpsDerek/workflows' &&
          github.event_name != 'workflow_call' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tests/catalog_imports.py --catalog-ref "$CATALOG_SHA"
      - name: Compile and validate agentic workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOWS_DIRECTORY: ${{ inputs.workflows-directory || '.github/workflows' }}
        run: |
          set -euo pipefail
          [[ -d "$WORKFLOWS_DIRECTORY" ]] || {
            echo "::error::Workflow directory '$WORKFLOWS_DIRECTORY' does not exist."
            exit 1
          }
          if ! find "$WORKFLOWS_DIRECTORY" -maxdepth 1 -type f -name '*.md' -print -quit | grep -q .; then
            echo "No local gh-aw workflow sources found; skipping compilation."
            exit 0
          fi

          gh aw compile --validate --actionlint --no-check-update --dir "$WORKFLOWS_DIRECTORY"

          if [[ -n "$(git status --porcelain -- "$WORKFLOWS_DIRECTORY")" ]]; then
            echo "::error::gh-aw lock files are missing or out of date. Run 'gh aw compile --dir $WORKFLOWS_DIRECTORY' and commit the generated files."
            git status --short -- "$WORKFLOWS_DIRECTORY"
            exit 1
          fi

  script-action-contract:
    name: Test checked-script and Python syntax action contracts
    if: github.repository == 'DevOpsDerek/workflows' && github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test SwiftLint input and invocation contracts
        run: python3 tests/swiftlint_contracts.py
      - name: Run Python fixture
        uses: ./.github/actions/run-checked-script
        with:
          runtime: python
          version: 3.12.8
          script-path: tests/fixtures/python/smoke.py
      - name: Parse intentionally non-executable Python source
        uses: ./.github/actions/check-python-syntax
        with:
          python-version: 3.12.8
          source-path: tests/fixtures/python/not_executed.py
      - name: Reject invalid Python syntax
        id: invalid-syntax
        continue-on-error: true
        uses: ./.github/actions/check-python-syntax
        with:
          python-version: 3.12.8
          source-path: tests/fixtures/python/invalid_syntax.py
      - name: Assert invalid syntax was rejected
        if: steps.invalid-syntax.outcome != 'failure'
        run: |
          echo "::error::Invalid Python syntax was accepted."
          exit 1
      - name: Reject a non-exact Python version
        id: python-version
        continue-on-error: true
        uses: ./.github/actions/check-python-syntax
        with:
          python-version: 3.12
          source-path: tests/fixtures/python/not_executed.py
      - name: Assert non-exact Python version was rejected
        if: steps.python-version.outcome != 'failure'
        run: |
          echo "::error::A non-exact Python version was accepted."
          exit 1
      - name: Reject Python path traversal
        id: python-traversal
        continue-on-error: true
        uses: ./.github/actions/check-python-syntax
        with:
          python-version: 3.12.8
          source-path: ../README.md
      - name: Assert Python path traversal was rejected
        if: steps.python-traversal.outcome != 'failure'
        run: |
          echo "::error::A Python source path outside the caller workspace was accepted."
          exit 1
      - name: Reject a directory instead of an explicitly named Python file
        id: python-directory
        continue-on-error: true
        uses: ./.github/actions/check-python-syntax
        with:
          python-version: 3.12.8
          source-path: tests/fixtures/python
      - name: Assert a directory source path was rejected
        if: steps.python-directory.outcome != 'failure'
        run: |
          echo "::error::A Python directory source path was accepted."
          exit 1
      - name: Reject unsupported runtime
        id: unsupported
        continue-on-error: true
        uses: ./.github/actions/run-checked-script
        with:
          runtime: shell
          version: 1.2.3
          script-path: tests/fixtures/python/smoke.py
      - name: Assert unsupported runtime was rejected
        if: steps.unsupported.outcome != 'failure'
        run: |
          echo "::error::An unsupported runtime was accepted."
          exit 1
      - name: Reject a non-exact version
        id: version
        continue-on-error: true
        uses: ./.github/actions/run-checked-script
        with:
          runtime: python
          version: 3.12
          script-path: tests/fixtures/python/smoke.py
      - name: Assert non-exact version was rejected
        if: steps.version.outcome != 'failure'
        run: |
          echo "::error::A non-exact runtime version was accepted."
          exit 1
      - name: Reject path traversal
        id: traversal
        continue-on-error: true
        uses: ./.github/actions/run-checked-script
        with:
          runtime: python
          version: 3.12.8
          script-path: ../README.md
      - name: Assert path traversal was rejected
        if: steps.traversal.outcome != 'failure'
        run: |
          echo "::error::A path outside the caller workspace was accepted."
          exit 1
      - name: Create a symlink to a file outside the working directory
        run: ln -s "$GITHUB_WORKSPACE/README.md" tests/fixtures/python/outside.py
      - name: Reject a symlinked Python source file
        id: python-symlink
        continue-on-error: true
        uses: ./.github/actions/check-python-syntax
        with:
          python-version: 3.12.8
          source-path: tests/fixtures/python/outside.py
      - name: Assert the symlinked Python source was rejected
        if: steps.python-symlink.outcome != 'failure'
        run: |
          echo "::error::A symlinked Python source file was accepted."
          exit 1
      - name: Reject symlink escape
        id: symlink
        continue-on-error: true
        uses: ./.github/actions/run-checked-script
        with:
          runtime: python
          version: 3.12.8
          working-directory: tests/fixtures/python
          script-path: tests/fixtures/python/outside.py
      - name: Assert symlink escape was rejected
        if: steps.symlink.outcome != 'failure'
        run: |
          echo "::error::A symlink outside the working directory was accepted."
          exit 1
      - name: Create a working-directory symlink outside the checkout
        run: ln -s /tmp tests/fixtures/python/outside-directory
      - name: Reject working-directory escape
        id: working-directory-escape
        continue-on-error: true
        uses: ./.github/actions/run-checked-script
        with:
          runtime: python
          version: 3.12.8
          working-directory: tests/fixtures/python/outside-directory
          script-path: tests/fixtures/python/smoke.py
      - name: Assert working-directory escape was rejected
        if: steps.working-directory-escape.outcome != 'failure'
        run: |
          echo "::error::A working directory outside the checkout was accepted."
          exit 1
      - name: Test lint workflow path validation behavior
        run: python3 tests/validate_repository_directory.py
      - name: Test reusable lint workflow contracts
        run: python3 tests/lint_workflow_contracts.py
