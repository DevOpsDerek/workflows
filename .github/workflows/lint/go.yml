name: Lint Go with golangci-lint

on:
  workflow_call:
    inputs:
      go-version:
        description: Exact Go version.
        required: false
        type: string
        default: 1.24.2
      golangci-lint-version:
        description: Exact golangci-lint version.
        required: false
        type: string
        default: 1.64.8
      working-directory:
        description: Repository-relative directory containing the Go module.
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate working directory
        id: target
        uses: DevOpsDerek/workflows/.github/actions/validate-repository-directory@7f6c8dbd3156bd67db0d05ee2ab501028b16792f
        with:
          path: ${{ inputs.working-directory }}
          name: working-directory
      - name: Validate exact versions
        shell: bash
        env:
          GO_VERSION: ${{ inputs.go-version }}
          LINTER_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          set -euo pipefail
          [[ "$GO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::go-version must be an exact three-part version."
            exit 1
          }
          [[ "$LINTER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::golangci-lint-version must be an exact three-part version."
            exit 1
          }
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: false
      - name: Install pinned golangci-lint binary
        shell: bash
        env:
          LINTER_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          set -euo pipefail
          case "$LINTER_VERSION" in
            1.*|2.*) ;;
            *)
              echo "::error::golangci-lint-version must be a supported 1.x or 2.x release."
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/golangci-lint-$LINTER_VERSION-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/golangci/golangci-lint/releases/download/v$LINTER_VERSION/golangci-lint-$LINTER_VERSION-linux-amd64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/golangci-lint-$LINTER_VERSION-linux-amd64" >> "$GITHUB_PATH"
      - name: Lint Go sources
        working-directory: ${{ steps.target.outputs.absolute-path }}
        run: golangci-lint run --timeout=5m
