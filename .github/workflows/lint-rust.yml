name: Check Rust formatting

on:
  workflow_call:
    inputs:
      rust-version:
        description: Exact Rust toolchain version.
        required: false
        type: string
        default: 1.86.0
      working-directory:
        description: Repository-relative directory containing the Cargo workspace.
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  lint:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate working directory
        id: target
        uses: DevOpsDerek/workflows/.github/actions/validate-repository-directory@7f6c8dbd3156bd67db0d05ee2ab501028b16792f
        with:
          path: ${{ inputs.working-directory }}
          name: working-directory
      - name: Validate exact version
        shell: bash
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
        run: |
          set -euo pipefail
          [[ "$RUST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::rust-version must be an exact three-part version."
            exit 1
          }
      - name: Install pinned Rust toolchain
        shell: bash
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
      - name: Check Rust formatting
        working-directory: ${{ steps.target.outputs.absolute-path }}
        env:
          RUST_VERSION: ${{ inputs.rust-version }}
        run: rustup run "$RUST_VERSION" cargo fmt --all -- --check
