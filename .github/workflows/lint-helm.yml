name: Lint Helm chart

on:
  workflow_call:
    inputs:
      helm-version:
        description: Exact Helm 3 release version.
        required: false
        type: string
        default: 3.17.3
      chart-path:
        description: Required repository-relative path to a local Helm chart directory.
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate chart path
        id: chart
        uses: DevOpsDerek/workflows/.github/actions/validate-repository-directory@7f6c8dbd3156bd67db0d05ee2ab501028b16792f
        with:
          path: ${{ inputs.chart-path }}
          name: chart-path
      - name: Validate exact version
        shell: bash
        env:
          HELM_VERSION: ${{ inputs.helm-version }}
        run: |
          set -euo pipefail
          [[ "$HELM_VERSION" =~ ^3\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::helm-version must be an exact Helm 3 version."
            exit 1
          }
      - name: Install pinned Helm
        shell: bash
        env:
          HELM_VERSION: ${{ inputs.helm-version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/helm-v$HELM_VERSION-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/helm-v$HELM_VERSION-linux-amd64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Lint chart without cluster or dependency access
        env:
          CHART: ${{ steps.chart.outputs.absolute-path }}
        run: helm lint --strict "$CHART"
